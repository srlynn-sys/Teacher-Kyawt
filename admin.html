<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b45"><title>Admin | Tamar Lann Federal School</title><link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--g:#176b45;--p:#eaf7ef;--ink:#18372a;--muted:#63786b;--line:#d7e9dc}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Padauk,Inter,sans-serif;color:var(--ink);background:linear-gradient(145deg,#f7fcf8,#edf8f0)}body:before{content:"";position:fixed;inset:0;z-index:0;background:url("https://drive.google.com/thumbnail?id=1c9mKGWCBmfebssDBTEcgHmQIZp3OyNKh&sz=w1200") center/min(76vw,460px) no-repeat;opacity:.09;pointer-events:none}.shell{position:relative;z-index:1;width:min(100% - 28px,650px);margin:auto;padding:22px 0 36px}.brand{text-align:center;padding:4px 8px 18px}.logo{width:82px;height:82px;object-fit:contain;border-radius:20px;background:#fff;padding:5px}.brand h1{font-size:clamp(20px,4.5vw,28px);margin:8px 0 0;color:var(--g)}.brand p{margin:3px 0;color:var(--muted)}.meta{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:8px}.meta span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--g);font-size:12px;font-weight:700}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 32px #17472c0c}.panel h2{margin:0 0 6px;color:var(--g);font-size:23px}.desc{margin:0 0 17px;color:var(--muted);font-size:14px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:700}.field input{width:100%;padding:12px;border:1px solid #c8ddce;border-radius:12px;font:inherit}.btn{display:inline-block;border:0;border-radius:12px;padding:12px 17px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--g);color:white}.secondary{background:var(--p);color:var(--g)}.danger{background:#b42318;color:white}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.status{display:none;margin-top:15px;border-radius:12px;padding:12px;background:#eef6ff;color:#174b7e}.status.show{display:block}.status.error{background:#fff0ef;color:#9f2019}.status.ok{background:#ecfdf3;color:#166534}.back{display:inline-block;margin:0 0 14px;color:var(--g);text-decoration:none;font-weight:700}.footer{text-align:center;color:#819489;font-size:12px;margin-top:20px}[hidden]{display:none!important}@media(max-width:390px){.shell{position:relative;z-index:1;width:calc(100% - 20px)}.panel{padding:17px}}
.result-table-wrap{width:100%;overflow-x:auto;margin-top:16px}.result-table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}.result-table th,.result-table td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:middle;overflow-wrap:anywhere}.result-table th{background:var(--p);color:var(--g)}.small-danger{border:0;border-radius:8px;padding:7px 9px;font:inherit;font-size:12px;font-weight:700;background:#b42318;color:#fff;cursor:pointer}</style></head><body><main class="shell"><a class="back" href="./index.html">← ပင်မစာမျက်နှာသို့</a><header class="brand"><img class="logo" src="https://drive.google.com/thumbnail?id=1c9mKGWCBmfebssDBTEcgHmQIZp3OyNKh&sz=w1200" data-logo-fallback="0" alt="School logo" onerror="if(this.dataset.logoFallback==='0'){this.dataset.logoFallback='1';this.src='https://drive.google.com/uc?export=view&id=1c9mKGWCBmfebssDBTEcgHmQIZp3OyNKh';}else if(this.dataset.logoFallback==='1'){this.dataset.logoFallback='2';this.src='https://lh3.googleusercontent.com/d/1c9mKGWCBmfebssDBTEcgHmQIZp3OyNKh';}else{this.style.display='none';}"><h1>Tamar Lann Federal School</h1><p>Teacher Kyawt · Chemistry</p><div class="meta"><span>Grade 10</span><span>Time Allowed: 2 Hours</span></div></header>
<section class="panel"><h2>Admin Panel</h2><p class="desc">ရလဒ်များကို စီမံခန့်ခွဲရန် Admin account ဖြင့် ဝင်ပါ။</p><div id="login"><div class="field"><label for="email">Admin Email</label><input id="email" type="email" autocomplete="username" placeholder="Admin email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"></div><button id="signIn" class="btn primary">Admin ဝင်မည်</button></div><div id="tools" hidden><p id="identity"></p><p class="desc">ကျောင်းသားတစ်ဦးချင်းစီ၏ ရလဒ်ကို ဖျက်နိုင်ပြီး၊ ရလဒ်အားလုံးကိုလည်း Reset လုပ်နိုင်ပါသည်။</p><div class="actions"><button id="refreshResults" class="btn secondary">ရလဒ်စာရင်း ပြန်ဖွင့်မည်</button><button id="reset" class="btn danger">ရလဒ်အားလုံး Reset လုပ်မည်</button><button id="signOut" class="btn secondary">ထွက်မည်</button></div><div id="adminResults" class="result-table-wrap"></div></div><div id="status" class="status"></div></section><footer class="footer">© Tamar Lann Federal School</footer></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,deleteDoc,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig,ADMIN_EMAIL} from "./firebase-config.js";
const s=(m,t="info")=>{const e=document.getElementById("status");e.textContent=m;e.className="status show "+t;};
let auth,db;
try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);}catch(e){console.error(e);s("Firebase ကို စတင်ချိတ်ဆက်၍မရပါ။","error");}
const studentIds=["10CF01","10CF02"];
function makeCell(row,value,header=false){const cell=document.createElement(header?"th":"td");cell.textContent=String(value);row.appendChild(cell);return cell;}
async function loadAdminResults(){
 const root=document.getElementById("adminResults");root.replaceChildren();
 if(!auth?.currentUser||auth.currentUser.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){s("Admin ဝင်ထားရန်လိုအပ်ပါသည်။","error");return;}
 s("ရလဒ်စာရင်းကို ဖတ်နေသည်…");
 try{
  const table=document.createElement("table");table.className="result-table";
  const thead=document.createElement("thead"),hr=document.createElement("tr");
  ["ကျောင်းသား ID","အစမ်းစာမေးပွဲရမှတ်","တရားဝင်ရမှတ်","လုပ်ဆောင်ချက်"].forEach(v=>makeCell(hr,v,true));thead.append(hr);
  const tbody=document.createElement("tbody");
  for(const id of studentIds){
   const [p,o]=await Promise.all([getDoc(doc(db,"practiceResults",id)),getDoc(doc(db,"results",id))]);
   const pd=p.exists()?p.data():null,od=o.exists()?o.data():null,tr=document.createElement("tr");
   makeCell(tr,id);makeCell(tr,pd?(String(pd.score??"—")+" / "+String(pd.total??50)):"မရှိသေးပါ");makeCell(tr,od?(String(od.score??"—")+" / "+String(od.total??"—")):"မရှိသေးပါ");
   const action=makeCell(tr,"");const btn=document.createElement("button");btn.className="small-danger";btn.textContent="ဤ ID ရလဒ်ဖျက်မည်";btn.addEventListener("click",()=>deleteStudentResults(id));action.appendChild(btn);tbody.append(tr);
  }
  table.append(thead,tbody);root.append(table);s("ကျောင်းသားနှစ်ဦး၏ ရလဒ်စာရင်းကို ပြသထားပါသည်။","ok");
 }catch(e){console.error(e);s("ရလဒ်စာရင်းကို မဖတ်နိုင်ပါ။ Firestore Rules ကို စစ်ပါ။","error");}
}
async function deleteStudentResults(id){
 if(!auth?.currentUser||auth.currentUser.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){s("Admin ဝင်ထားရန်လိုအပ်ပါသည်။","error");return;}
 if(!confirm(id+" ၏ အစမ်းစာမေးပွဲနှင့် တရားဝင်ရလဒ် နှစ်ခုလုံးကို ဖျက်မှာ သေချာပါသလား။"))return;
 try{await Promise.all([deleteDoc(doc(db,"practiceResults",id)),deleteDoc(doc(db,"results",id))]);s(id+" ၏ ရလဒ်များကို ဖျက်ပြီးပါပြီ။","ok");await loadAdminResults();}
 catch(e){console.error(e);s("ရလဒ်ဖျက်မရပါ။ Firebase Rules တွင် Admin delete ခွင့်ပြုထားမှုကို စစ်ပါ။","error");}
}
if(auth&&db){
 onAuthStateChanged(auth,u=>{
  const ok=!!u&&u.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();
  document.getElementById("login").hidden=ok;document.getElementById("tools").hidden=!ok;
  document.getElementById("identity").textContent=ok?"ဝင်ထားသော Admin: "+u.email:"";
  if(u&&!ok)signOut(auth).catch(console.error);
  if(ok)loadAdminResults();
 });
 document.getElementById("signIn").addEventListener("click",async()=>{
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  if(!email||!password){s("Email နှင့် Password ဖြည့်ပါ။","error");return;}
  if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){s("သတ်မှတ်ထားသော Admin email ဖြင့်သာ ဝင်နိုင်ပါသည်။","error");return;}
  try{await signInWithEmailAndPassword(auth,email,password);s("Admin ဝင်ရောက်ပြီးပါပြီ။","ok");}
  catch(e){s("ဝင်မရပါ။ Email/Password နှင့် Authentication setup ကိုစစ်ပါ။","error");}
 });
 document.getElementById("signOut").addEventListener("click",()=>signOut(auth).then(()=>s("ထွက်ပြီးပါပြီ။","ok")));
 document.getElementById("refreshResults").addEventListener("click",loadAdminResults);
 document.getElementById("reset").addEventListener("click",async()=>{
  if(!auth.currentUser||auth.currentUser.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){s("Admin ဝင်ထားရန်လိုအပ်ပါသည်။","error");return;}
  if(!confirm("သေချာပါသလား။ practiceResults နှင့် results ထဲရှိ ရလဒ်အားလုံးကို အပြီးဖျက်မည်။"))return;
  try{
   let deleted=0;
   for(const collectionName of ["practiceResults","results"]){
    const snap=await getDocs(collection(db,collectionName));
    let batch=writeBatch(db),count=0;
    for(const d of snap.docs){batch.delete(d.ref);count++;deleted++;if(count===450){await batch.commit();batch=writeBatch(db);count=0;}}
    if(count)await batch.commit();
   }
   s(deleted+" ခုသော ရလဒ်စာရွက်စာတမ်းများကို Reset လုပ်ပြီးပါပြီ။","ok");await loadAdminResults();
  }catch(e){console.error(e);s("Reset မလုပ်နိုင်ပါ။ Firebase Console ထဲရှိ Firestore Rules ကို Publish လုပ်ထားမှုနှင့် Admin email ကို စစ်ပါ။","error");}
 });
}
</script><script>

</script></body></html>
