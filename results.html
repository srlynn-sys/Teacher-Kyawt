<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b45"><title>ရလဒ်စစ်ဆေးရန် | Tamar Lann Federal School</title><link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--g:#176b45;--p:#eaf7ef;--ink:#18372a;--muted:#63786b;--line:#d7e9dc}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Padauk,Inter,sans-serif;color:var(--ink);background:linear-gradient(145deg,#f7fcf8,#edf8f0)}body:before{content:"";position:fixed;inset:0;z-index:-1;background:url("https://drive.google.com/thumbnail?id=1c9mKGWCBmfebssDBTEcgHmQIZp3OyNKh&sz=w1200") center/min(76vw,460px) no-repeat;opacity:.09;pointer-events:none}.shell{width:min(100% - 28px,650px);margin:auto;padding:22px 0 36px}.brand{text-align:center;padding:4px 8px 18px}.logo{width:82px;height:82px;object-fit:contain;border-radius:20px;background:#fff;padding:5px}.brand h1{font-size:clamp(20px,4.5vw,28px);margin:8px 0 0;color:var(--g)}.brand p{margin:3px 0;color:var(--muted)}.meta{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:8px}.meta span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--g);font-size:12px;font-weight:700}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 32px #17472c0c}.panel h2{margin:0 0 6px;color:var(--g);font-size:23px}.desc{margin:0 0 17px;color:var(--muted);font-size:14px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:700}.field input{width:100%;padding:12px;border:1px solid #c8ddce;border-radius:12px;font:inherit;outline:none}.field input:focus{border-color:var(--g);box-shadow:0 0 0 3px #176b4518}.btn{display:inline-block;border:0;border-radius:12px;padding:12px 17px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:var(--g);color:white}.secondary{background:var(--p);color:var(--g)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.status{display:none;margin-top:15px;border-radius:12px;padding:12px;background:#eef6ff;color:#174b7e;white-space:pre-wrap}.status.show{display:block}.status.error{background:#fff0ef;color:#9f2019}.status.ok{background:#ecfdf3;color:#166534}.result-card{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:15px;background:#f8fcf9}.result-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}.result-row:last-child{border-bottom:0}.result-row span:first-child{color:var(--muted)}.back{display:inline-block;margin:0 0 14px;color:var(--g);text-decoration:none;font-weight:700}.footer{text-align:center;color:#819489;font-size:12px;margin-top:20px}@media(max-width:390px){.shell{width:calc(100% - 20px)}.panel{padding:17px}}
</style></head><body><main class="shell"><a class="back" href="./index.html">← ပင်မစာမျက်နှာသို့</a><header class="brand"><img class="logo" src="https://drive.google.com/thumbnail?id=1c9mKGWCBmfebssDBTEcgHmQIZp3OyNKh&sz=w1200" data-logo-fallback="0" alt="School logo" onerror="if(this.dataset.logoFallback==='0'){this.dataset.logoFallback='1';this.src='https://drive.google.com/uc?export=view&id=1c9mKGWCBmfebssDBTEcgHmQIZp3OyNKh';}else if(this.dataset.logoFallback==='1'){this.dataset.logoFallback='2';this.src='https://lh3.googleusercontent.com/d/1c9mKGWCBmfebssDBTEcgHmQIZp3OyNKh';}else{this.style.display='none';}"><h1>Tamar Lann Federal School</h1><p>Teacher Kyawt · Chemistry</p><div class="meta"><span>Grade 10</span><span>Time Allowed: 2 Hours</span></div></header>
<section class="panel"><h2>ရလဒ်စစ်ဆေးရန်</h2><p class="desc">ကျောင်းသား ID ဖြင့် ရလဒ်ကို စစ်ဆေးပါ။</p><div class="field"><label for="resultId">ကျောင်းသား ID</label><input id="resultId" list="allowedIds" placeholder="10CF01 သို့မဟုတ် 10CF02" autocomplete="off"><datalist id="allowedIds"><option value="10CF01"><option value="10CF02"></datalist></div><div class="actions"><button id="checkResult" class="btn primary">ရလဒ်စစ်မည်</button><a class="btn secondary" href="./index.html">နောက်သို့</a></div><div id="status" class="status"></div><div id="output"></div></section><footer class="footer">© Tamar Lann Federal School</footer></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore,doc,getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const allowed=new Set(["10CF01","10CF02"]);let db;try{const app=initializeApp(firebaseConfig);db=getFirestore(app);}catch(e){console.error(e);}
const status=(msg,type="info")=>{const el=document.getElementById("status");el.textContent=msg;el.className="status show "+type;};
document.getElementById("checkResult").addEventListener("click",async()=>{const id=document.getElementById("resultId").value.trim().toUpperCase(),out=document.getElementById("output");out.replaceChildren();if(!allowed.has(id)){status("ခွင့်ပြုထားသော ID သည် 10CF01 နှင့် 10CF02 သာဖြစ်ပါသည်။","error");return;}if(!db){status("Firebase ချိတ်ဆက်မှုကို မစတင်နိုင်ပါ။","error");return;}status("ရလဒ်ရှာဖွေနေသည်…");try{const snap=await getDoc(doc(db,"results",id));if(!snap.exists()){status("ဤ ID အတွက် ရလဒ်မရှိသေးပါ။");return;}const data=snap.data(),card=document.createElement("div");card.className="result-card";const labels={studentId:"ကျောင်းသား ID",name:"အမည်",studentName:"အမည်",subject:"ဘာသာရပ်",score:"ရမှတ်",total:"စုစုပေါင်းအမှတ်",percentage:"ရာခိုင်နှုန်း",grade:"အဆင့်",status:"အခြေအနေ",examName:"စာမေးပွဲ"};for(const [key,label] of Object.entries(labels)){if(data[key]!==undefined){const row=document.createElement("div");row.className="result-row";const l=document.createElement("span"),v=document.createElement("strong");l.textContent=label;v.textContent=String(data[key]);row.append(l,v);card.append(row);}}if(!card.childElementCount){const p=document.createElement("p");p.textContent="ပြသနိုင်သော ရလဒ်အချက်အလက် မတွေ့ပါ။";card.append(p);}out.append(card);status("ရလဒ်ရရှိပါပြီ။","ok");}catch(e){console.error(e);status("ရလဒ်မဖတ်နိုင်ပါ။ Firebase Rules နှင့် setup ကို စစ်ဆေးပါ။","error");}});
</script><script>
