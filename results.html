<section class="panel"><h2>ကျောင်းသားနှစ်ဦး၏ ရလဒ်များ</h2><p class="desc">10CF01 နှင့် 10CF02 တို့၏ ရမှတ်များကို ဇယားတစ်ခုတည်းတွင် ကြည့်နိုင်ပါသည်။</p><div class="actions"><button id="refreshResults" class="btn primary">ရလဒ်အသစ်ပြန်စစ်မည်</button><a class="btn secondary" href="./index.html">နောက်သို့</a></div><div id="status" class="status"></div><div id="output"></div></section><footer class="footer">© Tamar Lann Federal School</footer></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore,doc,getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const allowed=["10CF01","10CF02"];
let db;
try{db=getFirestore(initializeApp(firebaseConfig));}catch(e){console.error(e);}
const status=(msg,type="info")=>{const el=document.getElementById("status");el.textContent=msg;el.className="status show "+type;};
async function loadResults(){
 const out=document.getElementById("output");out.replaceChildren();
 if(!db){status("Firebase ချိတ်ဆက်မှုကို မစတင်နိုင်ပါ။","error");return;}
 status("ကျောင်းသားနှစ်ဦး၏ ရလဒ်များကို ရှာဖွေနေသည်…");
 try{
  const records=await Promise.all(allowed.map(async id=>{
   const [practice,official]=await Promise.all([getDoc(doc(db,"practiceResults",id)),getDoc(doc(db,"results",id))]);
   const p=practice.exists()?practice.data():null,o=official.exists()?official.data():null;
   return {id,data:p||o,source:p?"အစမ်းစာမေးပွဲ":o?"တရားဝင်ရလဒ်":"ရလဒ်မရှိ",practice:p,official:o};
  }));
  const wrap=document.createElement("div");wrap.className="result-table-wrap";
  const table=document.createElement("table");table.className="result-table";
  const thead=document.createElement("thead"),head=document.createElement("tr");
  ["စဉ်","ကျောင်းသား ID","အမည်","ဘာသာရပ်","ရမှတ်","ရာခိုင်နှုန်း","ဖြေဆိုပြီး","မဖြေဆို","ရလဒ်အမျိုးအစား"].forEach(v=>{const th=document.createElement("th");th.textContent=v;head.append(th);});
  thead.append(head);const tbody=document.createElement("tbody");
  records.forEach((r,i)=>{
   const d=r.data||{},tr=document.createElement("tr");
   const values=[i+1,r.id,d.name||d.studentName||"—",d.subject||"Grade 10 Chemistry",r.data?(String(d.score??"—")+" / "+String(d.total??50)):"—",r.data?(String(d.percentage??(Number(d.score??0)/Number(d.total||50)*100))+"%"):"—",d.answered??"—",d.unanswered??"—",r.source];
   values.forEach((v,j)=>{const td=document.createElement("td");td.textContent=String(v);tr.append(td);});
   tbody.append(tr);
  });
  table.append(thead,tbody);wrap.append(table);out.append(wrap);
  const found=records.filter(r=>r.data).length;
  status(found+" / 2 ဦး၏ ရလဒ်ကို ပြသထားပါသည်။",found?"ok":"info");
 }catch(e){console.error(e);status("ရလဒ်များကို မဖတ်နိုင်ပါ။ Firebase Rules ကို စစ်ဆေးပါ။","error");}
}
document.getElementById("refreshResults").addEventListener("click",loadResults);
loadResults();
</script><script>
